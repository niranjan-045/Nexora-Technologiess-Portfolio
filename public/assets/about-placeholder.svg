<svg viewBox="0 0 500 625" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4EC"/>
      <stop offset="100%" stop-color="#FDE9D9"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#101010"/>
    </linearGradient>
  </defs>

  <rect width="500" height="625" fill="url(#bgGrad)"/>

  <!-- soft floating blobs -->
  <circle cx="80" cy="90" r="90" fill="#FF6B00" opacity="0.10"/>
  <circle cx="440" cy="540" r="120" fill="#F59E0B" opacity="0.12"/>
  <circle cx="440" cy="70" r="50" fill="#FF8C32" opacity="0.14"/>

  <!-- laptop -->
  <g transform="translate(90,220)">
    <rect x="0" y="0" width="320" height="200" rx="14" fill="url(#screenGrad)"/>
    <rect x="14" y="14" width="292" height="172" rx="4" fill="#0d0d0d"/>

    <!-- code lines -->
    <rect x="34" y="40" width="90" height="8" rx="4" fill="url(#barGrad)"/>
    <rect x="34" y="62" width="160" height="8" rx="4" fill="#3a3a3a"/>
    <rect x="34" y="84" width="120" height="8" rx="4" fill="#3a3a3a"/>
    <rect x="60" y="106" width="140" height="8" rx="4" fill="url(#barGrad)" opacity="0.8"/>
    <rect x="60" y="128" width="90" height="8" rx="4" fill="#3a3a3a"/>
    <rect x="34" y="150" width="60" height="8" rx="4" fill="url(#barGrad)" opacity="0.6"/>

    <!-- base -->
    <path d="M -20 200 L 340 200 L 360 232 L -40 232 Z" fill="#e8e8e8"/>
    <rect x="-40" y="228" width="400" height="8" rx="4" fill="#d8d8d8"/>
  </g>

  <!-- floating code bracket badges -->
  <g transform="translate(60,150)">
    <circle cx="0" cy="0" r="34" fill="#ffffff" opacity="0.9"/>
    <text x="0" y="12" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="30" font-weight="700" fill="#FF6B00">&lt;/&gt;</text>
  </g>
  <g transform="translate(420,300)">
    <circle cx="0" cy="0" r="30" fill="#ffffff" opacity="0.9"/>
    <text x="0" y="10" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="24" font-weight="700" fill="#F59E0B">{ }</text>
  </g>
  <g transform="translate(430,470)">
    <circle cx="0" cy="0" r="26" fill="#ffffff" opacity="0.9"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#FF8C32" stroke-width="3"/>
    <circle cx="0" cy="-14" r="3" fill="#FF8C32"/>
  </g>

  <!-- gear / build motif bottom-left -->
  <g transform="translate(70,470)" opacity="0.85">
    <circle cx="0" cy="0" r="30" fill="#ffffff" opacity="0.9"/>
    <path d="M0,-14 L4,-10 L10,-12 L11,-6 L17,-4 L14,2 L17,8 L11,10 L10,16 L4,14 L0,18 L-4,14 L-10,16 L-11,10 L-17,8 L-14,2 L-17,-4 L-11,-6 L-10,-12 L-4,-10 Z"
      fill="none" stroke="#FF6B00" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="0" cy="2" r="5" fill="#FF6B00"/>
  </g>
</svg>
